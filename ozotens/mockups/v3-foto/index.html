<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ОЗОТЭНС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Шапка: реалистичное фото во весь экран, зоны тела светятся небесным светом, слева - инфографика зоны. */
:root {
  --ink: #0b1024;
  --ink-soft: #4b5270;
  --paper: #f4f7fb;
  --ultra: #2335ff;
  --coral: #ff4a1c;
  --sky: #8fd0ff;
  --sky-deep: #3aa0ff;
  --line: rgba(11,16,36,.1);
  --f-display: "Dela Gothic One", "Arial Black", sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--f-mono); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
:focus-visible { outline: 3px solid var(--ultra); outline-offset: 3px; }

/* ---------- сцена ---------- */
.hero { position: relative; overflow: hidden; background: #e9eef4; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100svh; min-height: 620px; }
.layer { position: absolute; top: 0; height: 100%; aspect-ratio: 16 / 9; left: 50%; transform: translateX(-50%); }
.layer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .5s var(--ease); }
.hero.focus .layer img { filter: saturate(.85) brightness(.86); }

/* зоны тела */
.zone { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; border: 0; background: transparent; padding: 0; }
.zone .glow { position: absolute; inset: -35%; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(220,244,255,.95), rgba(143,208,255,.75) 38%, rgba(58,160,255,.28) 70%, transparent);
  mix-blend-mode: screen; filter: blur(6px); transition: opacity .35s var(--ease), transform .35s var(--ease); transform: scale(.85); }
.zone .dot { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(35,53,255,.35), 0 4px 14px rgba(11,16,36,.3); transition: transform .3s var(--ease); }
.zone .dot::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); animation: ping 2.2s var(--ease) infinite; }
@keyframes ping { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.zone:hover .glow, .zone.on .glow { opacity: 1; transform: scale(1); animation: breathe 2.4s ease-in-out infinite; }
.zone:hover .dot, .zone.on .dot { transform: scale(1.25); background: var(--sky); }
@keyframes breathe { 50% { transform: scale(1.08); opacity: .8; } }
.zone .lbl { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); white-space: nowrap; font: 700 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: rgba(11,16,36,.72); padding: 7px 10px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.zone:hover .lbl, .zone.on .lbl { opacity: 1; }

/* ---------- левая колонка: заголовок / инфографика ---------- */
.left { position: absolute; z-index: 5; left: clamp(20px, 5vw, 96px); top: 50%; transform: translateY(-46%); width: min(560px, 44vw); }
.intro, .info { transition: opacity .35s var(--ease), transform .35s var(--ease); }
.hero.focus .intro { opacity: 0; transform: translateY(-12px); pointer-events: none; }
.info { position: absolute; left: 0; top: 50%; width: 100%; opacity: 0; transform: translateY(calc(-50% + 14px)); pointer-events: none; }
.hero.focus .info { opacity: 1; transform: translateY(-50%); pointer-events: auto; }

.eyebrow { font-size: 13px; color: var(--ultra); display: flex; align-items: center; gap: 12px; }
.eyebrow i { width: 28px; height: 2px; background: currentColor; }
h1 { margin: 18px 0 0; font: 400 clamp(64px, 9vw, 150px)/.9 var(--f-display); letter-spacing: -.015em; }
h1 span { display: block; }
h1 .hot { color: var(--coral); }
.sub { margin-top: 22px; font-size: clamp(18px, 1.6vw, 23px); line-height: 1.4; color: var(--ink-soft); max-width: 30em; }
.sub b { color: var(--ink); }
.chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
.chip { height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid rgba(11,16,36,.18); background: rgba(255,255,255,.7); backdrop-filter: blur(8px); font: 500 16px/1 var(--f-body); color: var(--ink); cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
.chip:hover, .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.hot { border-color: var(--coral); color: var(--coral); }
.chip.hot:hover { background: var(--coral); color: #fff; }

/* карточка-инфографика */
.card { max-height: min(calc(100vw * 9 / 16 - 96px), calc(100svh - 96px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; background: rgba(255,255,255,.92); backdrop-filter: blur(14px); border-radius: 26px; padding: 22px 24px 18px; box-shadow: 0 30px 80px rgba(11,16,36,.18); border: 1px solid rgba(255,255,255,.8); }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card .num { font-size: 12px; color: var(--sky-deep); }
.card .close { border: 0; background: transparent; font: 500 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; padding: 6px; }
.card h2 { margin: 8px 0 0; font: 400 clamp(30px, 3vw, 44px)/1 var(--f-display); }
.card h2 em { font-style: normal; color: var(--coral); }
.pains { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.pains li { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: #fff0eb; color: #b32a08; }
.how { margin-top: 14px; font-size: 15.5px; color: var(--ink-soft); display: flex; gap: 12px; align-items: flex-start; }
.how svg { flex: none; width: 34px; height: 20px; stroke: var(--ultra); stroke-width: 2.2; fill: none; margin-top: 2px; }
.cols { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cols h3 { margin: 0 0 8px; font: 700 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.cols ul, .cols ol { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--ink-soft); }
.cols li + li { margin-top: 4px; }
.red { margin-top: 10px; font-size: 13px; color: #b32a08; }
.kit { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.kit h3 { margin: 0 0 10px; display: flex; justify-content: space-between; font: 700 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.kit h3 span { color: var(--ultra); }
.item { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; font-size: 16px; }
.item input { width: 20px; height: 20px; accent-color: var(--ultra); margin: 0; }
.item .p { margin-left: auto; font: 500 14px/1 var(--f-mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.buy { margin-top: 12px; display: flex; align-items: center; gap: 14px; }
.buy .btn { flex: 1; height: 58px; border: 0; border-radius: 999px; background: var(--ultra); color: #fff; font: 700 18px/1 var(--f-body); cursor: pointer; box-shadow: 0 14px 34px rgba(35,53,255,.3); }
.buy .sum { font: 400 24px/1 var(--f-display); white-space: nowrap; }
.note { margin-top: 10px; font: 400 11px/1.4 var(--f-mono); color: var(--ink-soft); }

/* подпись кадра и переключатель */
.bar { position: absolute; z-index: 6; left: 0; right: 0; bottom: 18px; display: flex; justify-content: space-between; align-items: center; padding-inline: clamp(20px, 5vw, 96px); gap: 16px; pointer-events: none; }
.legal { font-size: 11px; color: var(--ink-soft); max-width: 46ch; transition: opacity .3s; }
.hero.focus .legal { opacity: 0; }
.pick { pointer-events: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(11,16,36,.82); backdrop-filter: blur(10px); }
.pick button { border: 0; background: transparent; color: #cfd6ea; font: 500 12px/1 var(--f-mono); letter-spacing: .1em; padding: 10px 14px; border-radius: 999px; cursor: pointer; }
.pick button[aria-pressed="true"] { background: #fff; color: var(--ink); }

/* ---------- телефон ---------- */
@media (max-width: 860px) {
  .stage { aspect-ratio: auto; height: 78svh; min-height: 540px; max-height: none; }
  .layer { left: 0; transform: translateX(calc(50vw - var(--cx) * 1%)); }
  .left { position: relative; left: auto; top: auto; transform: none; width: auto; padding: 24px 20px 32px; }
  .info { position: relative; top: auto; transform: none; display: none; }
  .hero.focus .info { display: block; transform: none; }
  .hero.focus .intro { display: none; }
  .hero.focus .layer img { filter: none; }
  h1 { font-size: 64px; }
  .bar { position: absolute; top: calc(78svh - 60px); bottom: auto; }
  .legal { display: none; }
  .cols { grid-template-columns: 1fr; }
  .card { max-height: none; }
  .intro .chips { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="stage">
    <div class="layer" id="layer">
      <img id="photo" alt="Человек со спины - кадр-заглушка, сгенерирован для макета">
    </div>
  </div>

  <div class="left">
    <div class="intro">
      <p class="eyebrow mono"><i></i>ОЗОТЭНС · импульс + озоновый крем</p>
      <h1><span>Где</span><span class="hot">болит?</span></h1>
      <p class="sub">Наведи на тело - <b>покажем, что происходит</b>, как помочь себе сегодня и какой набор подойдёт именно тебе.</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
  </div>

  <div class="bar">
    <p class="legal mono">Имеются противопоказания. Необходимо проконсультироваться со специалистом</p>
    <div class="pick" role="group" aria-label="Кадр на выбор">
      <button type="button" data-v="0" aria-pressed="true">Кадр 1</button>
      <button type="button" data-v="1" aria-pressed="false">Кадр 2</button>
      <button type="button" data-v="2" aria-pressed="false">Кадр 3</button>
    </div>
  </div>
</section>

<script>
// Кадры Higgsfield (GPT Image 2.5, 2K). Координаты зон - доли кадра 16:9, размечены по превью.
const BASE = 'https://d8j0ntlcm91z4.cloudfront.net/user_3FUP8CMet0EzkJuWWICm94fxcbU/hf_20260930_181157_';
const SHOTS = [
  { id: '533309ad-56a8-4a6e-8965-3713ab8aca37', cx: 77, zones: {
    neck: [77.2, 14.5, 4.2], shoulder: [72.5, 21.5, 5], back: [77.2, 38, 6.5], sciatic: [77.2, 52, 7],
    knee: [74.3, 69, 4.2], foot: [81.6, 93, 4] } },
  { id: '7defd1b6-5758-4557-af17-19a4ffcc506c', cx: 69.5, zones: {
    neck: [69.4, 15, 3.6], shoulder: [65.2, 22, 4.4], back: [69.4, 39, 5.6], sciatic: [69.4, 50, 6.2],
    knee: [67.6, 68, 3.8], foot: [71, 94, 3.6] } },
  { id: 'c7d8e595-3024-4769-b957-d6d677164f21', cx: 74, zones: {
    neck: [74, 16, 3.4], shoulder: [70, 21.5, 4], back: [74.5, 39, 5], sciatic: [74, 48, 5.6],
    knee: [72.3, 66, 3.4], foot: [76.8, 88, 3.2] } },
];

// Цены - из выдачи поиска 30.09.2026, не сверены. Электроды - цена не найдена.
const PRICE = { device: 9900, cream: 775 };
const ELECTRODE = { back: '«СПИНА»', neck: '«ШЕЯ»', shoulder: '«ПЛЕЧО»', knee: '«КОЛЕНО»', foot: '«СТОПА»', sciatic: '«СПИНА»' };

const ZONES = {
  back: { n: '01', title: 'Поясница', hot: 'стреляет', chip: 'Поясница', pains: ['протрузия', 'грыжа', 'прострел при наклоне', 'ноет после сидения', 'утром не разогнуться'],
    how: 'Электрод «СПИНА» ложится на поясницу. Крем OZOTENS 30% под ним проводит ток, импульс работает прямо в зоне боли.',
    todo: ['Не лежать сутками: короткие прогулки по 10-15 минут', 'Вставать из-за стола каждые 40-50 минут', 'В машине - опора под поясницу'],
    ex: ['«Кошка-корова» на четвереньках, 10 раз', 'Колено к груди лёжа, по 20 секунд', 'Поза ребёнка, 30 секунд'] },
  sciatic: { n: '02', title: 'Седалищный нерв', hot: 'в ноги', chip: 'Ишиас', pains: ['стреляет в одну или обе ноги', 'немеет бедро', 'жжёт по задней поверхности', 'больно сидеть'],
    how: 'Электрод ставят на поясницу и ягодицу, откуда идёт нерв. Второй канал прибора - на вторую ногу.',
    todo: ['Сидеть не больше 30-40 минут подряд', 'Кошелёк и телефон - не в задний карман', 'Ходьба в спокойном темпе'],
    ex: ['Колено к противоположному плечу лёжа, по 20 секунд', 'Растяжка ягодицы «четвёрка» лёжа', 'Мягкий наклон к прямой ноге сидя, без рывков'] },
  neck: { n: '03', title: 'Шея', hot: 'клинит', chip: 'Шея', pains: ['зажим после ноутбука', 'не повернуть голову', 'тянет в затылок', 'отдаёт в плечо'],
    how: 'Электрод «ШЕЯ» - четыре сегмента на два канала, ложится на заднюю поверхность шеи.',
    todo: ['Экран на уровне глаз', 'Каждый час - минута разминки', 'Спать на подушке по высоте плеча'],
    ex: ['Втягивание подбородка, 10 раз по 5 секунд', 'Медленные наклоны головы к плечу', 'Сведение лопаток, 10 раз'] },
  shoulder: { n: '04', title: 'Плечо', hot: 'не поднять', chip: 'Плечо', pains: ['больно поднять руку', 'ноет ночью на боку', 'хрустит при вращении'],
    how: 'Электрод «ПЛЕЧО» обхватывает сустав, импульс и крем работают в самой болезненной точке.',
    todo: ['Не носить сумку на больном плече', 'Не держать руку неподвижно сутками', 'Тепло до упражнений, не после травмы'],
    ex: ['«Маятник»: рука свисает, мелкие круги', 'Ладонь «шагает» пальцами по стене вверх', 'Сведение лопаток, 10 раз'] },
  knee: { n: '05', title: 'Колено', hot: 'хрустит', chip: 'Колено', pains: ['больно на лестнице', 'хрустит при приседании', 'отекает к вечеру', 'трудно встать со стула'],
    how: 'Электрод «КОЛЕНО» повторяет форму сустава и держит крем там, где болит.',
    todo: ['Лестница - ступенька за ступенькой', 'Обувь с мягкой подошвой', 'Велосипед или ходьба вместо бега'],
    ex: ['Напряжение бедра лёжа, 10 раз по 5 секунд', 'Скольжение пятки по полу лёжа', 'Подъём прямой ноги лёжа, 10 раз'] },
  foot: { n: '06', title: 'Стопа', hot: 'пятка', chip: 'Стопа', pains: ['пятка болит с утра', 'жжёт свод стопы', 'ноет после ходьбы'],
    how: 'Электрод «СТОПА» ложится на пятку и свод, импульс снимает напряжение в зоне боли.',
    todo: ['Утром не вставать резко - сначала размять стопу', 'Не ходить босиком по твёрдому полу', 'Удобная обувь с поддержкой свода'],
    ex: ['Прокатывание мяча стопой, 1-2 минуты', 'Растяжка икры у стены, по 30 секунд', 'Тянуть носок на себя полотенцем'] },
};
const ORDER = ['back', 'sciatic', 'neck', 'shoulder', 'knee', 'foot'];
const RUB = n => n.toLocaleString('ru-RU') + ' ₽';

const hero = document.getElementById('hero'), layer = document.getElementById('layer'), photo = document.getElementById('photo'), info = document.getElementById('info');
let shot = 0, active = null;

function renderShot() {
  const s = SHOTS[shot];
  photo.src = BASE + s.id + '.png';
  layer.style.setProperty('--cx', s.cx);
  layer.querySelectorAll('.zone').forEach(z => z.remove());
  for (const key of ORDER) {
    const [x, y, r] = s.zones[key];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'zone'; b.dataset.k = key;
    b.style.left = x + '%'; b.style.top = y + '%'; b.style.width = b.style.height = (r * 2) + '%';
    b.style.height = `calc(${r * 2}% * 16 / 9)`;
    b.setAttribute('aria-label', ZONES[key].title);
    b.innerHTML = `<span class="glow"></span><span class="dot"></span><span class="lbl">${ZONES[key].n} · ${ZONES[key].title}</span>`;
    b.addEventListener('mouseenter', () => open(key));
    b.addEventListener('focus', () => open(key));
    b.addEventListener('click', () => open(key, true));
    layer.appendChild(b);
  }
  if (active) mark(active);
}

function mark(key) { layer.querySelectorAll('.zone').forEach(z => z.classList.toggle('on', z.dataset.k === key)); document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === key)); }

function open(key, scroll) {
  if (active === key) return;
  active = key; const z = ZONES[key];
  info.innerHTML = `
    <div class="card">
      <div class="top"><span class="num mono">${z.n} · зона боли</span><button class="close" type="button" id="close">Закрыть ✕</button></div>
      <h2>${z.title} <em>${z.hot}</em></h2>
      <ul class="pains">${z.pains.map(p => `<li>${p}</li>`).join('')}</ul>
      <p class="how"><svg viewBox="0 0 34 20"><path d="M0 10h8V3h6v14h6V10h14"/></svg><span>${z.how}</span></p>
      <div class="cols">
        <div><h3>Что делать сегодня</h3><ul>${z.todo.map(t => `<li>${t}</li>`).join('')}</ul></div>
        <div><h3>Упражнения</h3><ol>${z.ex.map(t => `<li>${t}</li>`).join('')}</ol></div>
      </div>
      <p class="red">Резкая боль, онемение, слабость в ноге - сначала к врачу. Упражнения без боли, комплекс согласуйте со специалистом.</p>
      <div class="kit">
        <h3>Твой набор <span>собери сам</span></h3>
        <label class="item"><input type="checkbox" data-p="${PRICE.device}" checked> Прибор ОЗОТЭНС <span class="p">${RUB(PRICE.device)}</span></label>
        <label class="item"><input type="checkbox" data-p="${PRICE.cream}" checked> Крем OZOTENS 30%, 150 мл <span class="p">${RUB(PRICE.cream)}</span></label>
        <label class="item"><input type="checkbox" data-p="0" checked> Электрод ${ELECTRODE[key]} <span class="p">цена уточняется</span></label>
        <div class="buy"><span class="sum" id="sum"></span><button class="btn" type="button">В корзину</button></div>
        <p class="note">Черновик: цены из открытых источников, сверить с производителем</p>
      </div>
    </div>`;
  const recalc = () => { let s = 0; info.querySelectorAll('.item input').forEach(i => { if (i.checked) s += +i.dataset.p; }); document.getElementById('sum').textContent = RUB(s); };
  info.querySelectorAll('.item input').forEach(i => i.addEventListener('change', recalc)); recalc();
  document.getElementById('close').addEventListener('click', close);
  hero.classList.add('focus'); mark(key);
  if (scroll && innerWidth <= 860) info.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function close() { active = null; hero.classList.remove('focus'); mark(null); }

const chips = document.getElementById('chips');
for (const key of ORDER) {
  const c = document.createElement('button'); c.type = 'button'; c.className = 'chip' + (key === 'back' ? ' hot' : ''); c.dataset.k = key; c.textContent = ZONES[key].chip;
  c.addEventListener('click', () => open(key)); chips.appendChild(c);
}
document.querySelectorAll('.pick button').forEach(b => b.addEventListener('click', () => {
  shot = +b.dataset.v; document.querySelectorAll('.pick button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderShot();
}));
// увёл курсор с фото и карточки - вернуть заголовок
hero.addEventListener('mouseleave', close);
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
renderShot();
</script>
</body>
</html>
